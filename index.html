<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardín de letras</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8f3; font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- Configuración ----------
const PLAYERS = [
  { name: 'Papá',  emoji: '🐻', keys: { left: 'KeyA', right: 'KeyD' }, labels: ['A', 'D'], color: '#7fb7d9', basket: 120, speed: 380 },
  { name: 'Sofía', emoji: '🐰', keys: { left: 'ArrowLeft', right: 'ArrowRight' }, labels: ['←', '→'], color: '#f2a7c3', basket: 150, speed: 380 },
];
// Las cuatro primeras van en este orden; después siguen palabras sencillas
const WORDS = ['SOFIA', 'XAVI', 'MARINA', 'PAULA', 'SOL', 'OSO', 'LUNA', 'CASA', 'MAR', 'GATO', 'PATO', 'FLOR', 'NUBE', 'MESA', 'PELOTA', 'PERRO'];
const SAY = { SOFIA: 'Sofía' };   // cómo se pronuncia en voz alta, si es distinto
const FALL_SPEED = 70;            // px/s, lento
const SPAWN_EVERY = [1.6, 2.2];   // segundos entre letras
const MAX_LETTERS = 5;
const GARDEN = ['🌷', '🌼', '🦋', '🌻', '🐞', '🍄', '🐝', '🌸', '🐌', '🐦', '🌺', '🦔', '🐸', '🐿️', '🌹', '🐛'];
// Fondos suaves que van cambiando con cada palabra
const THEMES = [
  { top: '#bfe0f0', bottom: '#f3f7e8', grass: '#b7dca0' },  // mañana
  { top: '#f6c9b8', bottom: '#fdf0d8', grass: '#c3d99a' },  // atardecer
  { top: '#d7c8ef', bottom: '#f4eefb', grass: '#b5d6b2' },  // lila
  { top: '#a9d8d0', bottom: '#eef8f1', grass: '#9fd0a5' },  // mar
  { top: '#8e9cc9', bottom: '#d9ddf0', grass: '#93b89a' },  // noche suave
  { top: '#f9e3a3', bottom: '#fff9e6', grass: '#bcd98e' },  // sol
];
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- Sonido suave y voz ----------
let ac;
function startAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }
function tone(freq, dur = 0.5, vol = 0.12, when = 0) {
  if (!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  good: i => tone(SCALE[i % SCALE.length]),
  other: () => tone(330, 0.25, 0.05),
  word: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.8, 0.1, i * 0.18)),
};
function speak(s) {
  try {
    const u = new SpeechSynthesisUtterance(s);
    u.lang = 'es-ES'; u.rate = 0.8; u.pitch = 1.1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}

// ---------- Estado ----------
const keys = {};
let state = 'menu'; // menu | play | pause
let wordIdx, filled, items, particles, flyers, garden, messages, spawnT, celebrate, theme, themeFrom, themeMix;

function reset() {
  wordIdx = 0; filled = 0; items = []; particles = []; flyers = []; garden = []; messages = [];
  spawnT = 0.5; celebrate = 0; theme = 0; themeFrom = 0; themeMix = 1;
  PLAYERS.forEach((p, i) => { p.x = W * (i ? 0.7 : 0.3); p.bounce = 0; });
}
const word = () => WORDS[wordIdx % WORDS.length];
const needed = () => word()[filled + flyers.length] || null;
const groundY = () => H - 80;
const rand = (a, b) => a + Math.random() * (b - a);
const slotPos = k => {
  const n = word().length, size = Math.min(70, (W - 40) / n - 10);
  return { x: W / 2 + (k - (n - 1) / 2) * (size + 12), y: 60, size };
};

// ---------- Letras ----------
function spawn() {
  if (items.filter(it => !it.landed).length >= MAX_LETTERS) return;
  const need = needed();
  const needOnScreen = items.some(it => !it.landed && it.letter === need);
  let letter;
  if (need && !needOnScreen && Math.random() < 0.75) letter = need;
  else if (Math.random() < 0.7) letter = word()[Math.floor(Math.random() * word().length)];
  else letter = 'ABCDEFGHIJLMNOPRSTUV'[Math.floor(Math.random() * 20)];
  const m = 60;
  items.push({ letter, x0: m + Math.random() * (W - 2 * m), y: -40, t: Math.random() * 6, vy: FALL_SPEED * rand(0.9, 1.1), fade: 1, hue: Math.floor(Math.random() * 5) });
}
function sparkle(x, y, color, n = 6) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = rand(30, 90);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, size: rand(2, 4) });
  }
}
function say(text) { messages = [{ text, life: 3.5 }]; }

function grow(emoji) {
  const n = garden.length;
  let k = n, x;
  do { x = 50 + ((k++ * 0.618) % 1) * (W - 100); } while ([W / 4, 3 * W / 4].some(c => Math.abs(x - c) < 90));
  garden.push({ emoji, x, y: groundY() + 30 + (n % 3) * 8, s: 0 });
}

function wordDone() {
  const w = word();
  sfx.word(); speak(SAY[w] || w.toLowerCase());
  say('¡' + w + '!');
  celebrate = 3;
  for (let k = 0; k < w.length; k++) { const s = slotPos(k); sparkle(s.x, s.y, '#ffe082', 6); }
  grow(GARDEN[garden.length % GARDEN.length]);
}
function nextWord() {
  wordIdx++; filled = 0;
  themeFrom = theme; theme = (theme + 1) % THEMES.length; themeMix = 0;
  items.forEach(it => { it.landed = true; }); // las letras de la palabra anterior se apagan
}

// ---------- Bucle ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state === 'play') update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}

function update(dt) {
  PLAYERS.forEach(p => {
    p.bounce = Math.max(0, p.bounce - dt * 3);
    const dir = (keys[p.keys.right] ? 1 : 0) - (keys[p.keys.left] ? 1 : 0);
    p.x += dir * p.speed * dt;
    p.x = Math.max(p.basket / 2, Math.min(W - p.basket / 2, p.x)); // toda la pantalla, os podéis cruzar
  });

  themeMix = Math.min(1, themeMix + dt / 3);

  if (celebrate > 0) {
    celebrate -= dt;
    if (celebrate <= 0) nextWord();
  } else {
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = rand(...SPAWN_EVERY); }
  }

  const gy = groundY();
  for (let k = items.length - 1; k >= 0; k--) {
    const it = items[k];
    it.t += dt;
    it.x = it.x0 + Math.sin(it.t * 1.2) * 16;
    if (it.landed) {
      it.fade -= dt * 0.7;
      if (it.fade <= 0) items.splice(k, 1);
      continue;
    }
    it.y += it.vy * dt;
    const p = PLAYERS.find(p => it.y > gy - 45 && it.y < gy && Math.abs(it.x - p.x) < p.basket / 2 + 12);
    if (p) { items.splice(k, 1); onCatch(it, p); continue; }
    if (it.y >= gy + 6) { it.y = gy + 6; it.landed = true; }
  }

  for (let k = flyers.length - 1; k >= 0; k--) {
    const f = flyers[k]; f.t += dt / 0.9;
    if (f.t >= 1) {
      flyers.splice(k, 1); filled++;
      const s = slotPos(f.slot); sparkle(s.x, s.y, '#fff3b0');
      if (filled === word().length) wordDone();
    }
  }
  garden.forEach(g => { g.s = Math.min(1, g.s + dt * 0.8); });
  for (let k = particles.length - 1; k >= 0; k--) {
    const q = particles[k]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.life -= dt * 0.9;
    if (q.life <= 0) particles.splice(k, 1);
  }
  messages.forEach(m => { m.life -= dt; });
  messages = messages.filter(m => m.life > 0);
}

function onCatch(it, p) {
  p.bounce = 1;
  const slot = filled + flyers.length;
  if (it.letter === word()[slot]) {
    sfx.good(slot); sparkle(it.x, it.y, '#fff3b0');
    flyers.push({ x: it.x, y: it.y, t: 0, slot, letter: it.letter, hue: it.hue });
  } else {
    // otra letra: no pasa nada, solo se deshace en burbujas
    sfx.other(); sparkle(it.x, it.y, '#ffffff', 5);
  }
}

// ---------- Dibujo ----------
const BUBBLES = ['#ffd6a5', '#caffbf', '#9bf6ff', '#bdb2ff', '#ffc6ff'];
function drawLetter(letter, x, y, r, hue, alpha = 1, glow = false) {
  ctx.save(); ctx.globalAlpha = alpha;
  if (glow) { ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 25; }
  ctx.fillStyle = BUBBLES[hue % BUBBLES.length];
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(x - r * 0.4, y - r * 0.4, r * 0.15, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a3b5c';
  ctx.font = `bold ${Math.round(r * 1.2)}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(letter, x, y + r * 0.06);
  ctx.restore();
}

function drawPlayer(p) {
  const gy = groundY();
  const squash = 1 + p.bounce * 0.08;
  ctx.save(); ctx.translate(p.x, gy);
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = p.color; ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  const bw = p.basket;
  ctx.beginPath(); ctx.moveTo(-bw / 2, -30); ctx.lineTo(bw / 2, -30); ctx.lineTo(bw / 2 - 14, 8); ctx.lineTo(-bw / 2 + 14, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.scale(1 / squash, squash);
  ctx.font = '60px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(p.emoji, 0, -22);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, color = '#5b4a6b', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size / 5; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawKeyHint(i) {
  const p = PLAYERS[i];
  const cx = W * (i ? 0.75 : 0.25), y = H - 30;
  ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [-1, 1].forEach((d, k) => {
    const bx = cx + d * 34;
    ctx.fillStyle = keys[k ? p.keys.right : p.keys.left] ? p.color : 'rgba(255,255,255,0.85)';
    roundRect(bx - 22, y - 20, 44, 40, 10); ctx.fill();
    ctx.fillStyle = '#5b4a6b'; ctx.fillText(p.labels[k], bx, y + 1);
  });
}

function drawWord(t) {
  const w = word();
  for (let k = 0; k < w.length; k++) {
    const { x, y, size } = slotPos(k);
    const isNext = k === filled + flyers.length && celebrate <= 0;
    ctx.fillStyle = isNext ? `rgba(255,255,255,${0.75 + Math.sin(t * 3) * 0.2})` : 'rgba(255,255,255,0.55)';
    roundRect(x - size / 2, y - size / 2, size, size, 14); ctx.fill();
    if (isNext) { ctx.lineWidth = 4; ctx.strokeStyle = '#f2b84b'; ctx.stroke(); }
    const done = k < filled;
    const lift = celebrate > 0 ? Math.sin(t * 6 + k * 0.7) * 6 : 0;
    // la letra se ve en gris clarito como pista, y en color cuando ya la habéis cogido
    text(w[k], x, y + 2 + lift, size * 0.7, done ? '#d16a93' : 'rgba(91,74,107,0.25)');
  }
}

function lerpColor(a, b, m) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * m)).join(',') + ')';
}

function draw(t) {
  const A = THEMES[themeFrom || 0], B = THEMES[theme || 0], m = themeMix ?? 1;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, lerpColor(A.top, B.top, m)); g.addColorStop(1, lerpColor(A.bottom, B.bottom, m));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // nubes de fondo, muy lentas
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  [[0.15, 0.3, 1], [0.6, 0.22, 0.8], [0.85, 0.4, 1.1]].forEach(([fx, fy, s], k) => {
    const x = ((fx * W + t * (6 + k * 2)) % (W + 200)) - 100, y = fy * H;
    [[-30, 0, 26], [0, -12, 32], [30, 0, 24]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); });
  });

  // prado
  const gy = groundY();
  ctx.fillStyle = lerpColor(A.grass, B.grass, m);
  ctx.beginPath(); ctx.moveTo(0, gy + 10);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, gy + 10 + Math.sin(x / 120) * 6);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  if (state !== 'menu') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    garden.forEach(gd => {
      const size = 30 * gd.s;
      if (size < 1) return;
      ctx.font = size + 'px serif';
      ctx.fillText(gd.emoji, gd.x, gd.y + Math.sin(t * 1.5 + gd.x) * 1.5);
    });
    const need = needed();
    items.forEach(it => drawLetter(it.letter, it.x, it.y, 30, it.hue, it.fade, !it.landed && it.letter === need));
    PLAYERS.forEach(drawPlayer);
    drawWord(t);
    flyers.forEach(f => {
      const s = slotPos(f.slot), e = 1 - Math.pow(1 - f.t, 3);
      drawLetter(f.letter, f.x + (s.x - f.x) * e, f.y + (s.y - f.y) * e - Math.sin(e * Math.PI) * 60, 30 - e * 6, f.hue);
    });
    particles.forEach(q => { ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    text('🌼 ' + garden.length, 20, 40, 26, '#5b4a6b', 'left');
    messages.forEach(mm => { ctx.globalAlpha = Math.min(1, mm.life); text(mm.text, W / 2, H * 0.32, 56, '#d16a93'); ctx.globalAlpha = 1; });
  }

  PLAYERS.forEach((p, i) => drawKeyHint(i));

  if (state === 'menu') {
    text('Jardín de letras', W / 2, H * 0.2, Math.min(64, W / 12), '#e0a32e');
    PLAYERS.forEach((p, i) => {
      const cx = W * (i ? 0.75 : 0.25);
      ctx.font = '84px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, cx, H * 0.42);
      text(p.name, cx, H * 0.54, 36, p.color);
      text(p.labels.join('  '), cx, H * 0.62, 30);
    });
    text('Atrapad las letras en orden y formad palabras', W / 2, H * 0.72, Math.min(26, W / 30));
    text('Pulsa ESPACIO o toca para empezar', W / 2, H * 0.8, Math.min(30, W / 26), '#5b4a6b');
  }
  if (state === 'pause') text('Pausa · ESPACIO para seguir', W / 2, H / 2, 40);
}

// ---------- Teclado ----------
const gameKeys = new Set(['Space', ...PLAYERS.flatMap(p => [p.keys.left, p.keys.right])]);
addEventListener('keydown', e => {
  if (gameKeys.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  startAudio();
  if (e.code === 'Space' && !e.repeat) {
    if (state === 'menu') { reset(); state = 'play'; }
    else if (state === 'play') state = 'pause';
    else if (state === 'pause') { state = 'play'; last = performance.now(); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- Táctil / ratón: los botones de abajo también funcionan ----------
const pointers = new Map();
function buttonAt(x, y) {
  if (y < H - 80) return null;
  for (let i = 0; i < PLAYERS.length; i++) {
    const cx = W * (i ? 0.75 : 0.25);
    if (Math.abs(x - (cx - 34)) < 34) return PLAYERS[i].keys.left;
    if (Math.abs(x - (cx + 34)) < 34) return PLAYERS[i].keys.right;
  }
  return null;
}
function syncPointerKeys() {
  PLAYERS.forEach(p => { keys[p.keys.left] = keys[p.keys.right] = false; });
  pointers.forEach(k => { if (k) keys[k] = true; });
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); startAudio(); window.focus();
  if (state === 'menu') { reset(); state = 'play'; return; }
  if (state === 'pause') { state = 'play'; last = performance.now(); }
  pointers.set(e.pointerId, buttonAt(e.clientX, e.clientY)); syncPointerKeys();
});
cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, buttonAt(e.clientX, e.clientY)); syncPointerKeys(); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, e => { pointers.delete(e.pointerId); syncPointerKeys(); }));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
